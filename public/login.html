<!doctype html>
<!--
  login.html — sign in / create account.

  A separate page rather than a modal inside the app: the server redirects here
  when there is no valid session, so a signed-out visitor never loads the
  dashboard shell at all.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no: an installed app should not pinch-zoom
     or double-tap-zoom like a web page. Safari ignores these in a normal tab
     (deliberately, for accessibility) and honours them once installed, which
     is exactly the split we want. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wilco">
<title>Sign in — Wilco</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS ignores the manifest's icons and uses this one. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- The browser/OS chrome colour. Two entries so the status bar matches
     whichever theme the phone is in. -->
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<main class="auth">
  <img class="auth-mark" src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1 id="auth-title">Welcome back</h1>
  <p class="auth-sub" id="auth-sub">Wilco. Your taskings, sorted.</p>

  <!-- novalidate: we show our own inline errors rather than the browser's
       native bubbles, which cannot be styled and look out of place. -->
  <form id="auth-form" novalidate>
    <label class="field-label" for="email">Email</label>
    <input id="email" type="email" autocomplete="email" inputmode="email"
           autocapitalize="none" spellcheck="false" required>

    <label class="field-label" for="password">Password</label>
    <!-- autocomplete tells a password manager whether to offer a saved
         password or to generate a new one; app.js flips it with the mode. -->
    <input id="password" type="password" autocomplete="current-password" required>

    <p class="auth-error" id="auth-error" role="alert" hidden></p>

    <button class="btn-primary" id="auth-submit" type="submit">Sign in</button>
  </form>

  <button class="btn-plain" id="auth-toggle" type="button">Create an account</button>
</main>

<script src="login.js"></script>
</body>
</html>
