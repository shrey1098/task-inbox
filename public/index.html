<!doctype html>
<!--
  index.html — the app shell.

  Almost everything below the nav bar is rendered by app.js; the markup here
  provides stable hooks and a loading state. Laid out as an iOS app: nav bar
  with a collapsing large title, a segmented filter, inset-grouped lists, and a
  tab bar. The sheets at the bottom are all off-screen until app.js adds .on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page extend under the notch and home indicator,
     which is what makes env(safe-area-inset-*) meaningful. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Standalone display + status-bar style, so "Add to Home Screen" on an
     iPhone launches this without Safari chrome around it. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inbox">
<title>Inbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header id="nav">
    <div class="nav-bar">
      <button class="nav-btn" id="account-btn" type="button" aria-label="Account">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6"/>
        </svg>
      </button>
      <button class="nav-btn" id="theme" type="button" title="Theme" aria-label="Change theme"></button>
      <span class="nav-title">Inbox</span>
      <button class="nav-btn nav-spacer" id="search-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
        </svg>
      </button>
      <button class="nav-btn" id="compose-btn" type="button" aria-label="New task">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <!-- The large title. #nav.scrolled fades this out and the inline one in.
         The eyebrow above it is a time-of-day greeting, filled in by app.js. -->
    <div class="large-title-wrap">
      <p class="eyebrow" id="greeting"></p>
      <h1 class="large-title" id="page-title">Inbox</h1>
      <p class="subtitle" id="synced">Updating…</p>
    </div>

    <!-- Search field. Hidden until the magnifier is tapped; it replaces the
         segmented control rather than stacking with it, so the header never
         grows tall enough to push the list off screen. -->
    <div class="searchbar" id="searchbar" hidden>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search tasks, people, notes"
             autocomplete="off" autocapitalize="none" spellcheck="false">
      <button id="search-cancel" type="button">Cancel</button>
    </div>

    <!-- Segmented filter. The sliding thumb is positioned by app.js. -->
    <div class="seg" id="seg" role="tablist">
      <div class="seg-thumb" id="seg-thumb"></div>
      <button data-filter="all" class="on" role="tab">All</button>
      <button data-filter="p1" role="tab">P1</button>
      <button data-filter="p2" role="tab">P2</button>
      <button data-filter="p3" role="tab">P3</button>
    </div>
  </header>

  <main id="main">
    <!-- The player card: level, XP, streak, today's goal. Rendered by app.js;
         tapping it opens the stats sheet. -->
    <section class="hero" id="hero" aria-label="Your progress"></section>
    <div id="content">
      <!-- Skeleton rows shown until the first fetch resolves. -->
      <div class="list">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
    <p class="list-footer" id="list-footer"></p>
  </main>

  <!-- Four tabs. Inbox is the list; Calendar is the same tasks by deadline;
       People groups them by who asked; Done is the archive. -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="inbox" class="on" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h4l2 3h6l2-3h4"/>
        <path d="M5 5h14l2 8v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z"/>
      </svg>
      Inbox
    </button>
    <button data-tab="calendar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2.5"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      Calendar
    </button>
    <button data-tab="people" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.2 2.9-4.8 6.5-4.8s6.5 1.6 6.5 4.8"/>
        <path d="M17 5.2a2.8 2.8 0 0 1 0 5.6M18.5 19c0-2-.6-3.4-1.8-4.3"/>
      </svg>
      People
    </button>
    <button data-tab="done" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>
      </svg>
      Done
    </button>
  </nav>

  <!-- One backdrop, shared by every sheet. -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Compose: prose in, Claude works out the task. -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="New task">
    <div class="grabber" aria-hidden="true"></div>
    <h2>New task</h2>
    <textarea id="compose-text"
              placeholder="Paste a message — Claude works out the task, deadline and priority."></textarea>
    <button class="btn-primary" id="compose-submit" type="button">Add</button>
    <button class="btn-plain" id="compose-cancel" type="button">Cancel</button>
  </div>

  <!-- Task detail: the whole record, editable, with the message it came from. -->
  <div class="sheet sheet-tall" id="detail-sheet" role="dialog" aria-modal="true" aria-label="Task">
    <div class="grabber" aria-hidden="true"></div>
    <div id="detail-body"></div>
  </div>

  <!-- Stats: level, streak, and a summary for any period you pick. -->
  <div class="sheet sheet-tall" id="stats-sheet" role="dialog" aria-modal="true" aria-label="Stats">
    <div class="grabber" aria-hidden="true"></div>
    <div id="stats-body"></div>
  </div>

  <!-- Account: identity, Telegram linking, seniors, digest preferences. -->
  <div class="sheet sheet-tall" id="account-sheet" role="dialog" aria-modal="true" aria-label="Account">
    <div class="grabber" aria-hidden="true"></div>
    <h2>Account</h2>
    <div class="group">
      <div class="line"><span class="k">Signed in as</span><span class="v" id="acct-email">—</span></div>
      <div class="line"><span class="k">Telegram</span><span class="v" id="acct-tg">—</span></div>
    </div>

    <!-- Populated when the user asks for a link code. -->
    <div id="link-area" hidden>
      <div class="link-code" id="link-code">------</div>
      <p class="link-hint">
        Send <strong>/link CODE</strong> to your bot on Telegram. Expires in 15 minutes.
      </p>
    </div>
    <button class="btn-primary" id="link-btn" type="button">Link Telegram</button>
    <button class="btn-plain btn-danger" id="unlink-btn" type="button" hidden>Unlink Telegram</button>

    <!-- Who outranks the clock. This is the authority rule's control surface. -->
    <h3 class="sheet-head">Always top priority</h3>
    <p class="sheet-note">
      Anything these people ask for is pinned to <strong>P1</strong>, whatever the deadline says.
    </p>
    <div class="chips" id="seniors-list"></div>
    <div class="add-row">
      <input id="senior-input" type="text" placeholder="CO, Col. Mehta, Director…"
             autocapitalize="words" spellcheck="false">
      <button class="btn-add" id="senior-add" type="button">Add</button>
    </div>

    <h3 class="sheet-head">Nudges</h3>
    <div class="group" id="settings-group"></div>

    <button class="btn-plain" id="logout-btn" type="button">Sign out</button>
    <button class="btn-plain" id="account-cancel" type="button">Done</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
